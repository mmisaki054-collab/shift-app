name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk shift-techo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shift-techo-apk
          path: shift-techo.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: シフト手帳 最新版
          body: 最新のAPKです。携帯でダウンロードしてインストールしてください。
          files: shift-techo.apk
          prerelease: false
