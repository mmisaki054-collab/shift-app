name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: 署名鍵がなければ作って保存(更新を上書きインストールできるよう鍵を固定)
        run: |
          if [ ! -f android/keystore/shift.jks ]; then
            mkdir -p android/keystore
            keytool -genkeypair -keystore android/keystore/shift.jks -alias shift -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass shift-techo -keypass shift-techo -dname "CN=Shift Techo, O=ShiftTecho, C=JP"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add android/keystore/shift.jks
            git commit -m "署名鍵を追加(自動)"
            git push
          fi
      - run: npm ci
      - run: npx cap sync android
      - name: バージョン決定
        run: |
          echo "APP_VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "APP_VERSION_NAME=$(node -p "require('./docs/app/version.json').version")" >> $GITHUB_ENV
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk shift-techo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shift-techo-apk
          path: shift-techo.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: シフト手帳 最新版
          body: 最新のAPKです。携帯でダウンロードしてインストールしてください。
          files: shift-techo.apk
          prerelease: false
